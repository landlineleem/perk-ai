<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@800&amp;display=swap');
    </style>
  </defs>

  <!-- Logo Mark: three overlapping rounded squares -->
  <rect x="8" y="8" width="34" height="34" rx="9" fill="#0D6E5E" opacity="0.25" transform="rotate(-12 25 25)"/>
  <rect x="14" y="14" width="34" height="34" rx="9" fill="#0D6E5E" opacity="0.5" transform="rotate(-4 31 31)"/>
  <rect x="20" y="20" width="34" height="34" rx="9" fill="#0D6E5E" transform="rotate(3 37 37)"/>
  <!-- Diamond accent inside front square -->
  <rect x="30" y="30" width="13" height="13" rx="3" fill="white" opacity="0.85" transform="rotate(45 36.5 36.5)"/>

  <!-- Wordmark -->
  <text x="72" y="56" font-family="'DM Sans', system-ui, sans-serif" font-weight="800" font-size="46" letter-spacing="-1.5" fill="#0A0F1C">perk</text>
  <text x="215" y="56" font-family="'DM Sans', system-ui, sans-serif" font-weight="800" font-size="46" letter-spacing="-1.5" fill="#0D6E5E">.</text>
  <text x="228" y="56" font-family="'DM Sans', system-ui, sans-serif" font-weight="800" font-size="46" letter-spacing="-1.5" fill="#0D6E5E">ai</text>
</svg>
