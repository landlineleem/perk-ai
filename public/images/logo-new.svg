<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');</style>
  </defs>
  <!-- PERK -->
  <text x="0" y="78" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="85" letter-spacing="-2" fill="#0A0F1C">PERK</text>
  <!-- Spiral/pinwheel mark in teal -->
  <g transform="translate(295, 50)" fill="#0D6E5E">
    <!-- 12 curved blades radiating from center -->
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(30)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(60)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(90)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(120)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(150)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(180)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(210)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(240)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(270)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(300)"/>
    <path d="M0,-22 C6,-18 8,-8 0,0" stroke="#0D6E5E" stroke-width="4.5" stroke-linecap="round" fill="none" transform="rotate(330)"/>
  </g>
  <!-- AI -->
  <text x="345" y="78" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="85" letter-spacing="-2" fill="#0A0F1C">AI</text>
</svg>
