<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;display=swap');
  </style>
  <!-- Perk in cream for dark backgrounds -->
  <text x="0" y="62" font-family="'Instrument Serif', Georgia, serif" font-size="68" fill="#F0EDE6" letter-spacing="-1">Perk</text>
  <!-- 4-pointed sparkle star — clean thin diamond points -->
  <g transform="translate(194, 16)">
    <!-- Vertical diamond -->
    <path d="M11 0 C11.5 8, 12.5 14, 11 22 C10.5 14, 9.5 8, 11 0Z" fill="#1FBB8E"/>
    <!-- Horizontal diamond -->
    <path d="M0 11 C8 10.5, 14 9.5, 22 11 C14 11.5, 8 12.5, 0 11Z" fill="#1FBB8E"/>
    <!-- Diagonal NE-SW -->
    <path d="M18 4 C14 7, 12 9, 4 18 C7 14, 9 12, 18 4Z" fill="#1FBB8E" opacity="0.8"/>
    <!-- Diagonal NW-SE -->
    <path d="M4 4 C7 7, 9 9, 18 18 C14 14, 12 12, 4 4Z" fill="#1FBB8E" opacity="0.8"/>
  </g>
  <!-- Smaller sparkle -->
  <g transform="translate(217, 6)">
    <path d="M5 0 C5.3 3.5, 5.7 6, 5 10 C4.7 6, 4.3 3.5, 5 0Z" fill="#1FBB8E"/>
    <path d="M0 5 C3.5 4.7, 6 4.3, 10 5 C6 5.3, 3.5 5.7, 0 5Z" fill="#1FBB8E"/>
    <path d="M8 2 C6 3.5, 5 4.5, 2 8 C3.5 6, 4.5 5, 8 2Z" fill="#1FBB8E" opacity="0.8"/>
    <path d="M2 2 C3.5 3.5, 4.5 4.5, 8 8 C6 6, 5 5, 2 2Z" fill="#1FBB8E" opacity="0.8"/>
  </g>
  <!-- AI in green -->
  <text x="234" y="62" font-family="'Instrument Serif', Georgia, serif" font-size="68" fill="#1FBB8E" letter-spacing="-1">AI</text>
</svg>